# Checks every push to main and every pull request: typecheck, then the jest
# suite. It uses no secrets, so it is safe on this public repo and on pull
# requests from forks. .env and google-services.json are gitignored and absent
# here; the suite mocks what it needs, and passed that way before this
# workflow was added (77 suites, 862 tests on 2026-10-15).
#
# Building and publishing an APK (EAS) is deliberately not part of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # React Native 0.86 accepts Node 20.19+, 22.13+ or 24.3+. 24 is the
          # LTS line the suite was verified on.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # --ci: a missing snapshot fails the run instead of being written.
      - run: npx jest --ci
